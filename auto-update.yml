name: Auto-Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten aktualisieren
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 scripts/auto_update.py
      - name: Änderungen speichern
        run: |
          git config user.name "joker-bot"
          git config user.email "joker-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-Update" && git push)
